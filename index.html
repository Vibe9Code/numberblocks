<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Numberblocks Stack Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app" aria-label="Numberblocks Stack Lab">
      <header class="top-bar">
        <h1>Numberblocks</h1>
        <button id="resetButton" class="reset-button" type="button">Reset</button>
      </header>

      <main id="sandbox" class="sandbox" aria-label="Main sandbox"></main>

      <footer class="tray" aria-label="Spawning tray">
        <div id="trayLane" class="tray-lane" aria-label="Block sources"></div>
      </footer>

    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
